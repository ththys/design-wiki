<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>디자인 위키</title>
<script>try{var t=localStorage.getItem("wiki-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ffffff; --side:#f7f8f9; --panel:#ffffff; --ink:#172b4d; --sub:#44546f; --muted:#626f86; --line:#dcdfe4; --line2:#ebecf0;
  --hover:#f1f2f4; --sel:#e9f2ff; --brand:#0c66e4; --brand-h:#0055cc; --brand-ink:#ffffff; --danger:#c9372c;
  --info:#e9f2ff; --info-b:#1d7afc; --note:#f3f0ff; --note-b:#8270db; --warn:#fff7d6; --warn-b:#e2b203; --ok:#dcfff1; --ok-b:#22a06b; --err:#ffeceb; --err-b:#e2483d;
  --code:#f7f8f9; --shadow:0 8px 24px rgba(9,30,66,.15),0 0 1px rgba(9,30,66,.31);
  --font:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
:root[data-theme="dark"]{
  --bg:#1d2125; --side:#161a1d; --panel:#22272b; --ink:#dee4ea; --sub:#b6c2cf; --muted:#8c9bab; --line:#38414a; --line2:#2c333a;
  --hover:#2c333a; --sel:#1c2b41; --brand:#579dff; --brand-h:#85b8ff; --brand-ink:#1d2125; --danger:#f87168;
  --info:#1c2b41; --note:#2b273f; --warn:#332e1b; --ok:#1c3329; --err:#42221f; --code:#161a1d; --shadow:0 8px 24px rgba(0,0,0,.45),0 0 1px rgba(255,255,255,.2);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1d2125; --side:#161a1d; --panel:#22272b; --ink:#dee4ea; --sub:#b6c2cf; --muted:#8c9bab; --line:#38414a; --line2:#2c333a;
  --hover:#2c333a; --sel:#1c2b41; --brand:#579dff; --brand-h:#85b8ff; --brand-ink:#1d2125; --danger:#f87168;
  --info:#1c2b41; --note:#2b273f; --warn:#332e1b; --ok:#1c3329; --err:#42221f; --code:#161a1d; --shadow:0 8px 24px rgba(0,0,0,.45),0 0 1px rgba(255,255,255,.2);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--brand)}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:4px;background:var(--hover);color:var(--ink);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn.primary{background:var(--brand);color:var(--brand-ink)} .btn.primary:hover{background:var(--brand-h)}
.btn.subtle{background:none} .btn.subtle:hover{background:var(--hover)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:4px;background:none;cursor:pointer;color:var(--sub)}
.ibtn:hover{background:var(--hover);color:var(--ink)}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:6px 8px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}

/* ── 상단 바 ── */
.topnav{position:fixed;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:30}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;padding:4px 8px;border-radius:4px}
.logo:hover{background:var(--hover)}
.logo i{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--brand);color:var(--brand-ink);font-style:normal;font-size:14px}
.tsearch{position:relative;flex:1;max-width:560px;margin-left:auto}
.tsearch input{width:100%;height:36px;padding-left:34px;background:var(--bg);border:1px solid var(--line)}
.tsearch input:focus{border:2px solid var(--brand);padding-left:33px}
.tsearch svg{position:absolute;left:10px;top:10px;color:var(--muted)}
.sres{position:absolute;top:42px;left:0;right:0;background:var(--panel);border-radius:6px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;padding:6px 0}
.sres a{display:block;padding:8px 14px;text-decoration:none;color:var(--ink)}
.sres a:hover,.sres a.on{background:var(--hover)}
.sres a b{display:block;font-weight:600} .sres a small{color:var(--muted);font-size:12px}
.sres .shd{padding:6px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.sres mark{background:var(--warn);color:inherit;border-radius:2px}
.tright{display:flex;align-items:center;gap:6px;margin-left:auto}
.avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:12px;border:0;cursor:pointer}
.menu{position:fixed;z-index:60;min-width:200px;background:var(--panel);border-radius:6px;box-shadow:var(--shadow);padding:6px 0}
.menu button,.menu a{display:flex;width:100%;align-items:center;gap:8px;padding:8px 14px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);text-decoration:none;font-size:14px}
.menu button:hover,.menu a:hover{background:var(--hover)}
.menu .mhd{padding:8px 14px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line2);margin-bottom:4px}
.menu .danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}

/* ── 사이드바 ── */
.side{position:fixed;top:56px;bottom:0;left:0;width:var(--sw,280px);background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.space{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.space i{display:grid;place-items:center;width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,#1d7afc,#8270db);color:#fff;font-style:normal;font-weight:700}
.space b{display:block;font-size:14px} .space small{color:var(--muted);font-size:12px}
.snav{padding:4px 8px}
.snav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:4px;color:var(--sub);text-decoration:none;font-weight:500}
.snav a:hover{background:var(--hover);color:var(--ink)}
.snav a.on{background:var(--sel);color:var(--brand)}
.shead{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 4px 16px;color:var(--muted);font-size:12px;font-weight:600}
.tree{flex:1;overflow:auto;padding:0 8px 24px}
.tnode{position:relative}
.trow{display:flex;align-items:center;gap:2px;height:32px;padding-right:4px;border-radius:4px;cursor:pointer;color:var(--sub);user-select:none}
.trow:hover{background:var(--hover);color:var(--ink)}
.trow.on{background:var(--sel);color:var(--brand);font-weight:600}
.trow .tw{flex:none;display:grid;place-items:center;width:24px;height:24px;border:0;background:none;border-radius:3px;color:var(--muted);cursor:pointer;padding:0}
.trow .tw:hover{background:var(--line)}
.trow .tw svg{transition:transform .12s}
.trow .tw.open svg{transform:rotate(90deg)}
.trow .tw.leaf{visibility:hidden}
.trow .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.trow .ta{display:none;gap:0}
.trow:hover .ta,.trow.on .ta{display:flex}
.trow .ta button{width:24px;height:24px;display:grid;place-items:center;border:0;background:none;border-radius:3px;color:var(--muted);cursor:pointer;padding:0}
.trow .ta button:hover{background:var(--line);color:var(--ink)}
.tkids{padding-left:16px}
.trow.dropin{outline:2px solid var(--brand);outline-offset:-2px}
.trow.dropb::before,.trow.dropa::after{content:"";position:absolute;left:8px;right:4px;height:2px;background:var(--brand)}
.trow.dropb::before{top:-1px} .trow.dropa::after{top:31px}
.trow.dragging{opacity:.4}
.side .sfoot{padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px}
.mode i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok-b);margin-right:6px}
.mode.local i{background:var(--warn-b)}

/* ── 본문 ── */
.main{margin-left:var(--sw,280px);padding-top:56px;min-height:100vh}
.pagehd{display:flex;align-items:center;gap:8px;padding:12px 24px 0;min-height:44px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;color:var(--muted);font-size:13px;flex:1;min-width:0}
.crumbs a{color:var(--muted);text-decoration:none} .crumbs a:hover{color:var(--brand);text-decoration:underline}
.crumbs span.sep{opacity:.6}
.pactions{display:flex;gap:4px;align-items:center}
.content{max-width:var(--cw,800px);margin:0 auto;padding:16px 32px 36px}
.content.full{--cw:100%}
.ptitle{font-size:28px;font-weight:600;line-height:1.3;margin:12px 0 6px;letter-spacing:-.01em;word-break:keep-all}
.byline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:24px}
.byline .avatar{width:24px;height:24px;font-size:10px;cursor:default}

/* 문서 본문 (보기·편집 같은 모양) */
.doc{font-size:15px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
.doc>*:first-child{margin-top:0}
.doc p{margin:0 0 12px}
.doc h1{font-size:24px;font-weight:600;margin:32px 0 12px;line-height:1.35}
.doc h2{font-size:20px;font-weight:600;margin:28px 0 10px;line-height:1.4}
.doc h3{font-size:16px;font-weight:600;margin:22px 0 8px}
.doc ul,.doc ol{margin:0 0 12px;padding-left:26px}
.doc li{margin:2px 0}
.doc li>p{margin:0}
.doc blockquote{margin:0 0 12px;padding:2px 0 2px 16px;border-left:2px solid var(--line);color:var(--sub)}
.doc hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.doc code{font-family:var(--mono);font-size:.88em;background:var(--code);border:1px solid var(--line2);border-radius:3px;padding:1px 4px}
.doc pre{font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--code);border:1px solid var(--line2);border-radius:4px;padding:12px 14px;margin:0 0 14px;overflow:auto;white-space:pre-wrap}
.doc pre code{background:none;border:0;padding:0}
.doc table{border-collapse:collapse;margin:0 0 16px;width:100%;table-layout:fixed}
.doc th,.doc td{border:1px solid var(--line);padding:7px 10px;vertical-align:top;text-align:left;min-width:60px}
.doc th{background:var(--hover);font-weight:600}
.doc td p,.doc th p{margin:0}
.doc figure{margin:16px 0;text-align:center}
.doc figure img,.doc figure video{max-width:100%;border-radius:4px;display:inline-block;vertical-align:top}
.doc figure.w-s img,.doc figure.w-s video{width:33%} .doc figure.w-m img,.doc figure.w-m video{width:60%}
.doc figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.doc a.plink{font-weight:500;text-decoration:none;border-bottom:1px solid currentColor}
.doc a.plink.broken{color:var(--danger);border-bottom-style:dashed}
.doc ul.check{list-style:none;padding-left:4px}
.doc ul.check li{position:relative;padding-left:28px}
.doc ul.check li::before{content:"";position:absolute;left:2px;top:5px;width:16px;height:16px;border:2px solid var(--muted);border-radius:3px;box-sizing:border-box;cursor:pointer;background:var(--panel)}
.doc ul.check li.done::before{background:var(--brand);border-color:var(--brand)}
.doc ul.check li.done::after{content:"";position:absolute;left:8px;top:7px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.doc ul.check li.done{color:var(--muted);text-decoration:line-through}
.doc .panel{position:relative;border-radius:4px;padding:10px 14px 10px 44px;margin:0 0 14px;background:var(--info)}
.doc .panel::before{position:absolute;left:14px;top:10px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--info-b);content:"i"}
.doc .panel.note{background:var(--note)} .doc .panel.note::before{background:var(--note-b);content:"✎"}
.doc .panel.warn{background:var(--warn)} .doc .panel.warn::before{background:var(--warn-b);content:"!"}
.doc .panel.ok{background:var(--ok)} .doc .panel.ok::before{background:var(--ok-b);content:"✓"}
.doc .panel.err{background:var(--err)} .doc .panel.err::before{background:var(--err-b);content:"×"}
.doc .panel>*:last-child{margin-bottom:0}

/* 아래: 링크된 곳·댓글 */
.below{max-width:var(--cw,800px);margin:0 auto;padding:0 32px 80px}
.below h4{font-size:14px;margin:0 0 10px;color:var(--sub)}
.blinks{border-top:1px solid var(--line);padding-top:20px;margin-bottom:28px}
.blinks a{display:inline-flex;margin:0 8px 6px 0;padding:3px 9px;border-radius:3px;background:var(--hover);text-decoration:none;color:var(--ink);font-size:13px}
.blinks a:hover{background:var(--sel);color:var(--brand)}
.comments{border-top:1px solid var(--line);padding-top:20px}
.cmt{display:flex;gap:10px;margin-bottom:16px}
.cmt .avatar{flex:none;cursor:default}
.cmt .cb{flex:1;min-width:0}
.cmt .cm{font-size:13px;color:var(--muted);margin-bottom:2px} .cmt .cm b{color:var(--ink);margin-right:6px}
.cmt .ct{white-space:pre-wrap;line-height:1.6}
.cmt .cx{font-size:12px;color:var(--muted);border:0;background:none;padding:0;margin-top:2px;cursor:pointer}
.cmt .cx:hover{color:var(--danger);text-decoration:underline}
.cnew{display:flex;gap:10px}
.cnew textarea{flex:1;min-height:40px;resize:vertical}
.cnew .row{display:flex;gap:6px;margin-top:6px}

/* 홈·목록 */
.hero{background:linear-gradient(120deg,var(--sel),var(--note));border-radius:8px;padding:28px 28px 24px;margin:8px 0 28px}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{margin:0;color:var(--sub)}
.hero .row{display:flex;gap:8px;margin-top:16px}
.stats{display:flex;gap:24px;margin-top:14px;color:var(--sub);font-size:13px} .stats b{color:var(--ink);font-size:18px;margin-right:4px}
.sec h3{font-size:15px;margin:0 0 10px}
.plist{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:28px}
.plist a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line2);text-decoration:none;color:var(--ink)}
.plist a:last-child{border-bottom:0}
.plist a:hover{background:var(--hover)}
.plist .pi{flex:none;width:28px;height:28px;border-radius:4px;background:var(--sel);color:var(--brand);display:grid;place-items:center}
.plist .pm{flex:1;min-width:0} .plist .pm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .pm small{color:var(--muted);font-size:12px}
.plist .pw{color:var(--muted);font-size:12px;white-space:nowrap}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* ── 편집 ── */
.edbar{position:sticky;top:56px;z-index:15;display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.edbar .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.edbar button.t{height:32px;min-width:32px;padding:0 7px;border:0;border-radius:3px;background:none;cursor:pointer;color:var(--sub);font-weight:500}
.edbar button.t:hover{background:var(--hover);color:var(--ink)}
.edbar button.t.on{background:var(--sel);color:var(--brand)}
.edbar select{height:32px;border:0;background:var(--hover);font-weight:500}
.edbar .grow{flex:1}
.edstate{color:var(--muted);font-size:12px;margin-right:8px}
.titlein{width:100%;font-size:28px;font-weight:600;border:0;background:none;padding:6px 0;margin:14px 0 4px;letter-spacing:-.01em}
.titlein:focus{border:0}
.editor{min-height:50vh;outline:none;padding-bottom:30vh;cursor:text}
.editor:empty::before,.editor>p:only-child:has(br:only-child)::before{content:"내용을 입력하세요. / 를 눌러 표·패널·이미지 등을 넣을 수 있어요";color:var(--muted);pointer-events:none}
.editor figure{position:relative}
.editor figure.sel img,.editor figure.sel video{outline:2px solid var(--brand);outline-offset:2px}
.figbar{position:absolute;z-index:16;display:flex;gap:2px;background:var(--ink);border-radius:4px;padding:3px}
.figbar button{border:0;background:none;color:var(--bg);font-size:12px;padding:4px 8px;border-radius:3px;cursor:pointer}
.figbar button:hover,.figbar button.on{background:rgba(255,255,255,.2)}
.tblbar{position:absolute;z-index:16;display:flex;gap:2px;background:var(--panel);border-radius:4px;box-shadow:var(--shadow);padding:3px}
.tblbar button{border:0;background:none;font-size:12px;padding:4px 8px;border-radius:3px;cursor:pointer;color:var(--ink)}
.tblbar button:hover{background:var(--hover)} .tblbar .danger{color:var(--danger)}
.pick{position:absolute;z-index:40;width:320px;background:var(--panel);border-radius:6px;box-shadow:var(--shadow);padding:6px 0;max-height:300px;overflow:auto}
.pick .ph{padding:6px 12px;font-size:11px;font-weight:700;color:var(--muted)}
.pick button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;padding:7px 12px;cursor:pointer;text-align:left}
.pick button.on,.pick button:hover{background:var(--sel)}
.pick button small{color:var(--muted);font-size:12px}
.uping{display:block;padding:24px;text-align:center;background:var(--hover);border-radius:4px;color:var(--muted);font-size:13px}

/* 모달·토스트 */
.scrim{position:fixed;inset:0;background:rgba(9,30,66,.54);z-index:50;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border-radius:6px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.modal.wide{width:min(1000px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 8px}
.modal header h2{margin:0;font-size:18px}
.modal .mb{padding:8px 22px;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--sub)}
.err{color:var(--danger);font-size:13px;margin:4px 0}
.hist{display:grid;grid-template-columns:260px 1fr;gap:0;min-height:50vh}
.hist .hl{border-right:1px solid var(--line);overflow:auto;max-height:65vh}
.hist .hl button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.hist .hl button.on{background:var(--sel)}
.hist .hl small{display:block;color:var(--muted);font-size:12px}
.hist .hv{padding:6px 20px;overflow:auto;max-height:65vh}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;box-shadow:var(--shadow);z-index:70;display:flex;gap:12px;align-items:center;font-size:14px}
.toast button{background:none;border:0;color:var(--brand-h);font-weight:600;cursor:pointer;padding:0}
:root[data-theme="dark"] .toast button{color:#0055cc}

/* 로그인 */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,var(--sel),var(--bg) 60%)}
.gate .card{width:min(400px,100%);background:var(--panel);border-radius:8px;box-shadow:var(--shadow);padding:32px}
.gate h1{font-size:22px;margin:12px 0 4px} .gate p{color:var(--muted);margin:0 0 20px}
.gate .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:16px 0}
.gate .or::before,.gate .or::after{content:"";flex:1;border-top:1px solid var(--line)}
.gate input{width:100%;margin-bottom:8px}
.gate .btn{width:100%;justify-content:center;height:40px}

.gtabs{display:flex;gap:4px;margin:16px 0 4px;border-bottom:2px solid var(--line)}
.gtabs button{border:0;background:none;padding:8px 12px;margin-bottom:-2px;border-bottom:2px solid transparent;cursor:pointer;font-weight:600;color:var(--muted)}
.gtabs button.on{color:var(--brand);border-color:var(--brand)}
.gstep{padding:10px 12px;border-radius:4px;background:var(--hover);margin-bottom:8px;font-size:13px}
.gstep.done{background:var(--ok);color:var(--ink)}
.nbadge{margin-left:auto;background:var(--danger);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:0 6px;line-height:18px}
.nbadge:empty{display:none}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line2)}
.mrow:last-child{border-bottom:0}
.mrow .pm{flex:1;min-width:0} .mrow .pm b{display:block;font-weight:500} .mrow .pm small{color:var(--muted);font-size:12px}
.sgate{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;margin:0 0 24px;background:var(--ok)}
.sgate.closed{background:var(--err)}
.sgate .sdot{width:10px;height:10px;border-radius:50%;background:var(--ok-b);flex:none}
.sgate.closed .sdot{background:var(--err-b)}
.sgate .pm{flex:1;min-width:0} .sgate .pm b{display:block} .sgate .pm small{color:var(--sub);font-size:12px}
.mtoggle{display:none}
@media (max-width:900px){
  .side{transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  body.navopen .side{transform:none}
  .main{margin-left:0}
  .mtoggle{display:inline-grid}
  .content,.below{padding-left:18px;padding-right:18px}
  .tsearch{max-width:none}
  .hist{grid-template-columns:1fr} .hist .hl{max-height:30vh;border-right:0;border-bottom:1px solid var(--line)}
}
</style>

<body>
<div id="gate" class="gate" hidden></div>
<div id="app" hidden>
  <header class="topnav">
    <button class="ibtn mtoggle" id="navBtn" aria-label="메뉴"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <a class="logo" href="#/"><i>W</i><span id="logoName">디자인 위키</span></a>
    <button class="btn primary" id="createBtn" type="button">+ 만들기</button>
    <div class="tsearch">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="검색 (제목·본문)  /" autocomplete="off">
      <div class="sres" id="sres" hidden></div>
    </div>
    <div class="tright">
      <button class="ibtn" id="themeBtn" type="button" aria-label="화면 밝기"></button>
      <button class="avatar" id="meBtn" type="button" aria-label="내 계정"></button>
    </div>
  </header>
  <aside class="side" id="side">
    <div class="space"><i id="spaceIcon">D</i><div><b id="spaceName">디자인 위키</b><small>팀 공간</small></div></div>
    <nav class="snav">
      <a href="#/" data-nav="home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 3l9 8v10H3z"/></svg>개요</a>
      <a href="#/members" data-nav="members" id="navMembers" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.8 3.1 2.6 3.5 5.2"/></svg>팀원 관리<span class="nbadge" id="nReq"></span></a>
      <a href="#/recent" data-nav="recent"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>최근 수정</a>
    </nav>
    <div class="shead"><span>페이지</span><button class="ibtn" id="addRoot" type="button" title="최상위 페이지 만들기" style="width:24px;height:24px">+</button></div>
    <div class="tree" id="tree"></div>
    <div class="sfoot"><span class="mode" id="mode"><i></i><span>불러오는 중</span></span></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="scrim" class="scrim" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script>
"use strict";
const CFG = window.WIKI_CONFIG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const SPACE = CFG.spaceName || "디자인 위키";
const LS = "wiki-v1";
const FORCE_LOCAL = /[?&]local\b/.test(location.search);
let mode = "local", fs = null, auth = null, user = null;
let pages = [];                 // {id,title,html,text,parent,order,links,createdAt,createdBy,updatedAt,updatedBy,version}
let unsub = null, ready = false;
let open = new Set(JSON.parse(localStorage.getItem("wiki-open") || "[]"));
let editing = null;             // {id, startedAt, isNew}

/* ───────── 공통 ───────── */
let toastT = null;
function toast(msg, act, fn){
  const t = $("#toast"); t.innerHTML = `<span>${esc(msg)}</span>${act ? `<button type="button">${esc(act)}</button>` : ""}`; t.hidden = false;
  if (act) t.querySelector("button").onclick = () => { t.hidden = true; fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, act ? 6000 : 2600);
}
const me = () => user ? { email: user.email || "", name: user.displayName || (user.email || "").split("@")[0] || "나" } : { email: "", name: "나" };
const initials = n => (String(n || "?").trim()[0] || "?").toUpperCase();
const when = t => { if (!t) return ""; const d = new Date(t), now = Date.now(), s = (now - t) / 1000;
  if (s < 60) return "방금"; if (s < 3600) return `${Math.floor(s / 60)}분 전`; if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)}일 전`;
  return d.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric" }); };
const byId = id => pages.find(p => p.id === id);
const kids = pid => pages.filter(p => (p.parent || null) === (pid || null)).sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || (a.createdAt || 0) - (b.createdAt || 0));
const pathOf = p => { const out = []; let c = p, g = 0; while (c && g++ < 50) { out.unshift(c); c = c.parent ? byId(c.parent) : null; } return out; };
const isDesc = (id, anc) => { let c = byId(id), g = 0; while (c && g++ < 50) { if (c.parent === anc) return true; c = c.parent ? byId(c.parent) : null; } return false; };
const errMsg = ex => /permission|insufficient/i.test(String(ex && (ex.code || ex.message))) ? "권한이 없어요. 관리자에게 위키 권한(이메일 등록)을 요청하세요" : "저장하지 못했어요. 인터넷 연결을 확인해 주세요";

/* ───────── 저장소 (클라우드/로컬 같은 모양) ───────── */
const local = {
  read(){ try { return JSON.parse(localStorage.getItem(LS) || "null") || { pages: [], history: [], comments: [] }; } catch { return { pages: [], history: [], comments: [] }; } },
  write(d){ localStorage.setItem(LS, JSON.stringify(d)); },
};
const store = {
  async savePage(id, data){
    if (mode === "cloud") return fs.collection("wiki_pages").doc(id).set(data, { merge: true });
    const d = local.read(), i = d.pages.findIndex(p => p.id === id);
    if (i < 0) d.pages.push({ id, ...data }); else d.pages[i] = { ...d.pages[i], ...data };
    local.write(d); loadLocal();
  },
  async batchPages(list){ /* [{id, data}] */
    if (mode === "cloud") { const b = fs.batch(); list.forEach(x => b.set(fs.collection("wiki_pages").doc(x.id), x.data, { merge: true })); return b.commit(); }
    const d = local.read(); list.forEach(x => { const i = d.pages.findIndex(p => p.id === x.id); if (i >= 0) d.pages[i] = { ...d.pages[i], ...x.data }; }); local.write(d); loadLocal();
  },
  async deletePages(ids){
    if (mode === "cloud") { const b = fs.batch(); ids.forEach(id => b.delete(fs.collection("wiki_pages").doc(id))); return b.commit(); }
    const d = local.read(); d.pages = d.pages.filter(p => !ids.includes(p.id)); local.write(d); loadLocal();
  },
  async addHistory(h){
    if (mode === "cloud") return fs.collection("wiki_history").add(h);
    const d = local.read(); d.history.push({ id: uid(), ...h }); local.write(d);
  },
  async history(pageId){
    if (mode === "cloud") { const s = await fs.collection("wiki_history").where("pageId", "==", pageId).get(); return s.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => b.at - a.at); }
    return local.read().history.filter(h => h.pageId === pageId).sort((a, b) => b.at - a.at);
  },
  async comments(pageId){
    if (mode === "cloud") { const s = await fs.collection("wiki_comments").where("pageId", "==", pageId).get(); return s.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => a.at - b.at); }
    return local.read().comments.filter(c => c.pageId === pageId).sort((a, b) => a.at - b.at);
  },
  async addComment(c){
    if (mode === "cloud") return fs.collection("wiki_comments").add(c);
    const d = local.read(); d.comments.push({ id: uid(), ...c }); local.write(d);
  },
  async delComment(id){
    if (mode === "cloud") return fs.collection("wiki_comments").doc(id).delete();
    const d = local.read(); d.comments = d.comments.filter(c => c.id !== id); local.write(d);
  },
};
function loadLocal(){ pages = local.read().pages; ready = true; renderTree(); route(true); }

/* ───────── HTML 정리 (붙여 넣기·저장·보기 공통) ───────── */
const KEEP = new Set(["P","H1","H2","H3","B","I","U","S","A","UL","OL","LI","BLOCKQUOTE","PRE","CODE","HR","BR","TABLE","THEAD","TBODY","TR","TH","TD","FIGURE","FIGCAPTION","IMG","VIDEO","DIV"]);
const DROP = new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","LINK","META","NOSCRIPT","TEMPLATE","SVG","CANVAS","FORM","INPUT","BUTTON","SELECT","TEXTAREA"]);
const PANELS = ["info","note","warn","ok","err"];
function sanitize(html){
  const doc = document.implementation.createHTMLDocument(""), root = doc.createElement("div"); root.innerHTML = html || "";
  const walk = (node, out) => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) { out.appendChild(doc.createTextNode(n.data)); return; }
      if (n.nodeType !== 1) return;
      let t = n.tagName;
      if (DROP.has(t)) return;
      if (t === "STRONG") t = "B"; else if (t === "EM") t = "I"; else if (t === "STRIKE" || t === "DEL") t = "S";
      else if (/^H[4-6]$/.test(t)) t = "H3";
      if (t === "DIV") {
        const pk = PANELS.find(k => n.classList && n.classList.contains("panel") && (n.classList.contains(k) || (k === "info" && !PANELS.some(x => x !== "info" && n.classList.contains(x)))));
        if (n.classList && n.classList.contains("panel")) { const e = doc.createElement("div"); e.className = "panel " + (pk || "info"); walk(n, e); if (!e.childNodes.length) e.appendChild(doc.createElement("p")); out.appendChild(e); return; }
        const hasBlock = [...n.children].some(c => /^(P|H[1-6]|UL|OL|TABLE|PRE|BLOCKQUOTE|FIGURE|DIV|HR)$/.test(c.tagName));
        if (hasBlock) { walk(n, out); return; }
        const p = doc.createElement("p"); walk(n, p); if (!p.childNodes.length) p.appendChild(doc.createElement("br")); out.appendChild(p); return;
      }
      if (!KEEP.has(t)) { walk(n, out); return; }
      if (t === "IMG" || t === "VIDEO") {
        const src = n.getAttribute("src") || n.getAttribute("data-src") || "";
        if (!/^(https:\/\/|data:image\/)/.test(src)) return;
        const m = doc.createElement(t); m.setAttribute("src", src);
        if (t === "VIDEO") { m.setAttribute("controls", ""); m.setAttribute("loop", ""); m.setAttribute("muted", ""); m.setAttribute("playsinline", ""); }
        else m.setAttribute("alt", n.getAttribute("alt") || "");
        if (out.tagName === "FIGURE") { out.appendChild(m); return; }
        const f = doc.createElement("figure"); f.appendChild(m); out.appendChild(f); return;
      }
      const e = doc.createElement(t);
      if (t === "A") {
        const pg = n.getAttribute("data-page"), h = n.getAttribute("href") || "";
        if (pg && /^[\w-]+$/.test(pg)) { e.setAttribute("data-page", pg); e.setAttribute("href", "#/p/" + pg); e.className = "plink"; }
        else if (/^(https?:|mailto:)/i.test(h)) { e.setAttribute("href", h); e.setAttribute("target", "_blank"); e.setAttribute("rel", "noopener"); }
        else { walk(n, out); return; }
      }
      if (t === "FIGURE") { const w = ["w-s", "w-m"].find(c => n.classList && n.classList.contains(c)); if (w) e.className = w; }
      if (t === "UL" && n.classList && n.classList.contains("check")) e.className = "check";
      if (t === "LI" && n.classList && n.classList.contains("done")) e.className = "done";
      if ((t === "TD" || t === "TH")) { ["colspan", "rowspan"].forEach(a => { const v = parseInt(n.getAttribute(a)); if (v > 1 && v < 50) e.setAttribute(a, v); }); }
      walk(n, e);
      if (t === "FIGURE" && !e.querySelector("img,video")) return;
      out.appendChild(e);
    });
  };
  const out = doc.createElement("div"); walk(root, out);
  return out.innerHTML;
}
const plainOf = html => { const d = document.createElement("div"); d.innerHTML = html; d.querySelectorAll("p,li,h1,h2,h3,td,th,pre,blockquote,figcaption").forEach(e => e.append(" ")); return d.textContent.replace(/\s+/g, " ").trim(); };
const linksOf = html => { const d = document.createElement("div"); d.innerHTML = html; return [...new Set([...d.querySelectorAll("a[data-page]")].map(a => a.getAttribute("data-page")))]; };

/* ───────── 라우팅 ───────── */
function parseHash(){ const h = decodeURIComponent(location.hash.replace(/^#\/?/, "")); const [a, b, c] = h.split("/");
  if (a === "p" && b) return { v: c === "edit" ? "edit" : "page", id: b };
  if (a === "new") return { v: "new", parent: b || null };
  if (a === "recent") return { v: "recent" };
  if (a === "members") return { v: "members" };
  if (a === "search") return { v: "search", q: b || "" };
  return { v: "home" }; }
let lastRoute = "";
function route(force){
  if (!ready) return;
  const key = location.hash; if (!force && key === lastRoute) return;
  if (editing && !force) { /* 편집 중 다른 곳으로 가려 하면 확인 */ }
  lastRoute = key;
  const r = parseHash();
  document.body.classList.remove("navopen");
  document.querySelectorAll(".snav a").forEach(a => a.classList.toggle("on", a.dataset.nav === r.v));
  if (r.v === "page") return showPage(r.id);
  if (r.v === "edit") return showEditor(r.id);
  if (r.v === "new") return newPage(r.parent);
  if (r.v === "recent") return showRecent();
  if (r.v === "members") return showMembers();
  if (r.v === "search") return showSearch(r.q);
  return showHome();
}
window.addEventListener("hashchange", () => {
  if (editing && editDirty() && !location.hash.endsWith("/edit")) {
    if (!confirm("저장하지 않은 내용이 있어요. 나갈까요? (임시 저장은 남아 있어요)")) { history.replaceState(null, "", lastRoute); return; }
  }
  if (editing && !location.hash.endsWith("/edit")) stopEdit();
  route();
});
window.addEventListener("beforeunload", e => { if (editing && editDirty()) { e.preventDefault(); e.returnValue = ""; } });

/* ───────── 페이지 트리 ───────── */
const chev = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>`;
function renderTree(){
  const cur = parseHash().id;
  if (cur) pathOf(byId(cur) || {}).forEach(p => { if (p.id !== cur) open.add(p.id); });
  const node = p => { const ks = kids(p.id), o = open.has(p.id);
    return `<div class="tnode" data-id="${esc(p.id)}"><div class="trow ${p.id === cur ? "on" : ""}" draggable="true" data-row="${esc(p.id)}">
      <button class="tw ${ks.length ? "" : "leaf"} ${o ? "open" : ""}" data-tw="${esc(p.id)}" type="button" aria-label="펼치기">${chev}</button>
      <span class="tt">${esc(p.title || "제목 없음")}</span>
      <span class="ta"><button type="button" data-tadd="${esc(p.id)}" title="하위 페이지 만들기">+</button><button type="button" data-tmore="${esc(p.id)}" title="더 보기">⋯</button></span></div>
      ${ks.length && o ? `<div class="tkids">${ks.map(node).join("")}</div>` : ""}</div>`; };
  const roots = kids(null);
  $("#tree").innerHTML = roots.length ? roots.map(node).join("") : `<div style="padding:10px 12px;color:var(--muted);font-size:13px">아직 페이지가 없어요.<br>위 + 로 첫 페이지를 만들어 보세요.</div>`;
}
function saveOpen(){ localStorage.setItem("wiki-open", JSON.stringify([...open])); }
let dragId = null;
function wireTree(){
  const tr = $("#tree");
  tr.addEventListener("click", e => {
    const tw = e.target.closest("[data-tw]"); if (tw) { const id = tw.dataset.tw; open.has(id) ? open.delete(id) : open.add(id); saveOpen(); renderTree(); return; }
    const ad = e.target.closest("[data-tadd]"); if (ad) { open.add(ad.dataset.tadd); saveOpen(); location.hash = "#/new/" + ad.dataset.tadd; return; }
    const mo = e.target.closest("[data-tmore]"); if (mo) { pageMenu(mo.dataset.tmore, mo); return; }
    const row = e.target.closest("[data-row]"); if (row) location.hash = "#/p/" + row.dataset.row;
  });
  tr.addEventListener("contextmenu", e => { const row = e.target.closest("[data-row]"); if (!row) return; e.preventDefault(); pageMenu(row.dataset.row, null, e.clientX, e.clientY); });
  const clear = () => tr.querySelectorAll(".dropin,.dropb,.dropa").forEach(x => x.classList.remove("dropin", "dropb", "dropa"));
  const zone = (row, e) => { const r = row.getBoundingClientRect(), y = (e.clientY - r.top) / r.height; return y < .28 ? "b" : y > .72 ? "a" : "in"; };
  tr.addEventListener("dragstart", e => { const row = e.target.closest("[data-row]"); if (!row) return; dragId = row.dataset.row; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/wiki", dragId); row.classList.add("dragging"); });
  tr.addEventListener("dragend", () => { dragId = null; clear(); tr.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging")); });
  tr.addEventListener("dragover", e => { if (!dragId) return; const row = e.target.closest("[data-row]"); clear(); if (!row) { e.preventDefault(); return; }
    const t = row.dataset.row; if (t === dragId || isDesc(t, dragId)) return; e.preventDefault(); row.classList.add("drop" + zone(row, e)); });
  tr.addEventListener("drop", e => { if (!dragId) return; e.preventDefault(); const row = e.target.closest("[data-row]"); const id = dragId; clear();
    if (!row) return movePage(id, null, null);
    const t = row.dataset.row; if (t === id || isDesc(t, id)) return; const z = zone(row, e);
    if (z === "in") { open.add(t); saveOpen(); movePage(id, t, null); } else { const tp = byId(t); movePage(id, tp.parent || null, t, z === "a"); } });
}
async function movePage(id, parent, refId, after){
  const p = byId(id); if (!p) return; const before = { parent: p.parent || null, order: p.order };
  const sibs = kids(parent).filter(x => x.id !== id);
  let idx = sibs.length; if (refId) { idx = sibs.findIndex(x => x.id === refId); if (after) idx++; }
  sibs.splice(idx, 0, p);
  const upd = sibs.map((x, i) => ({ id: x.id, data: x.id === id ? { parent: parent || null, order: i } : { order: i } })).filter(u => { const x = byId(u.id); return x.order !== u.data.order || u.id === id; });
  try { await store.batchPages(upd); toast(`‘${p.title || "제목 없음"}’을(를) 옮겼어요`, "되돌리기", () => store.savePage(id, before)); }
  catch (ex) { toast(errMsg(ex)); }
}
function closeMenus(){ document.querySelectorAll(".menu").forEach(m => m.remove()); }
document.addEventListener("click", e => { if (!e.target.closest(".menu,[data-tmore],#meBtn,#pMore")) closeMenus(); });
function showMenu(items, anchor, x, y){
  closeMenus(); const m = document.createElement("div"); m.className = "menu";
  m.innerHTML = items.map((it, i) => it === "-" ? "<hr>" : it.head ? `<div class="mhd">${esc(it.head)}</div>` : `<button type="button" data-i="${i}" class="${it.danger ? "danger" : ""}">${esc(it.label)}</button>`).join("");
  document.body.appendChild(m);
  const r = anchor ? anchor.getBoundingClientRect() : { left: x, bottom: y, right: x };
  let L = anchor ? r.right - m.offsetWidth : r.left, T = r.bottom + 4;
  L = Math.max(8, Math.min(L, innerWidth - m.offsetWidth - 8)); if (T + m.offsetHeight > innerHeight - 8) T = Math.max(8, (anchor ? r.top : y) - m.offsetHeight - 4);
  m.style.left = L + "px"; m.style.top = T + "px";
  m.onclick = e => { const b = e.target.closest("[data-i]"); if (!b) return; closeMenus(); items[+b.dataset.i].run(); };
}
function pageMenu(id, anchor, x, y){
  const p = byId(id); if (!p) return;
  showMenu([
    { label: "열기", run: () => location.hash = "#/p/" + id },
    { label: "편집", run: () => location.hash = "#/p/" + id + "/edit" },

  main().innerHTML = `<div class="pagehd"><div class="crumbs"><a href="#/">${esc(SPACE)}</a><span class="sep">/</span><span>팀원 관리</span></div></div>
  <div class="content"><h1 class="ptitle">팀원 관리</h1><div class="byline">가입 요청을 승인하면 바로 위키에 들어올 수 있어요. 하루 가입 요청은 ${DAY_MAX}개까지 받아요.</div>
  <div class="sgate ${signupClosed ? "closed" : ""}"><span class="sdot"></span><span class="pm"><b>${signupClosed ? "가입 신청 막힘" : "가입 신청 받는 중"}</b><small>${signupClosed ? "새 가입 신청을 받지 않아요. 이미 들어온 요청은 승인할 수 있어요." : "누구나 로그인 화면에서 가입 요청을 보낼 수 있어요."}</small></span>
    <button class="btn sm ${signupClosed ? "primary" : "danger"}" id="sgToggle">${signupClosed ? "가입 다시 받기" : "가입 막기"}</button></div>
  <div class="sec"><h3>가입 요청 ${reqs.length}</h3>${reqs.length ? `<div class="plist">${reqs.map(r => `<div class="mrow"><span class="avatar" style="cursor:default">${esc(initials(r.name || r.email))}</span>
      <span class="pm"><b>${esc(r.name || "(이름 없음)")}</b><small>${esc(r.email)} · ${ago(r.at)} · ${r.provider === "google.com" ? "구글 계정" : r.verified ? "이메일 인증됨" : "이메일 인증 전"}</small></span>
      <button class="btn sm primary" data-ok="${esc(r.uid)}">승인</button><button class="btn sm" data-no="${esc(r.uid)}">거절</button></div>`).join("")}</div>` : `<p style="color:var(--muted)">새 요청이 없어요.</p>`}</div>
  <div class="sec"><h3>팀원 ${members.length}</h3>${members.length ? `<div class="plist">${members.map(m => `<div class="mrow"><span class="avatar" style="cursor:default">${esc(initials(m.name || m.email))}</span>
      <span class="pm"><b>${esc(m.name || m.email)}</b><small>${esc(m.email)} · ${ago(m.at)} 승인</small></span><button class="btn sm" data-rm="${esc(m.email)}">내보내기</button></div>`).join("")}</div>` : `<p style="color:var(--muted)">승인한 팀원이 아직 없어요. (규칙에 직접 적은 관리자는 여기 안 보여요)</p>`}</div></div>`;
  $("#sgToggle").onclick = async () => { const next = !signupClosed, b = $("#sgToggle"); b.disabled = true;
    try { await SETTINGS().set({ signupClosed: next, at: Date.now(), by: me().email }, { merge: true }); signupClosed = next; toast(next ? "가입 신청을 막았어요" : "가입 신청을 다시 받아요"); showMembers(); }
    catch (ex) { b.disabled = false; toast("바꾸지 못했어요: " + (/permission/i.test(ex.code || "") ? "Firestore 규칙에 wiki_meta/settings 부분을 넣어 주세요" : (ex.code || ""))); } };
  const approve = async (r, b) => { if (b) { b.disabled = true; b.textContent = "승인 중…"; }
    try { const bt = fs.batch(); bt.set(fs.collection("wiki_members").doc(r.email.toLowerCase()), { name: r.name || "", at: Date.now(), by: me().email }); bt.delete(fs.collection("wiki_requests").doc(r.uid)); await bt.commit(); toast(`${r.name || r.email}님을 승인했어요`); }
    catch (ex) { if (b) { b.disabled = false; b.textContent = "승인"; } toast("승인하지 못했어요: " + (/permission/i.test(ex.code || "") ? "규칙에서 관리자 권한을 확인해 주세요" : (ex.code || ex.message || ""))); } };
  main().querySelectorAll("[data-ok]").forEach(b => b.onclick = () => { const r = reqs.find(x => x.uid === b.dataset.ok); if (!r) return;
    if (r.provider === "google.com" || r.verified) return approve(r, b);
    modal(`<header><h2>승인할까요?</h2></header><div class="mb"><p><b>${esc(r.name || r.email)}</b> (${esc(r.email)})님은 아직 <b>이메일 인증 전</b>이에요.</p>
      <p style="color:var(--muted);font-size:13px">지금 승인해 둬도 돼요. 본인이 메일함(스팸함 포함)에서 인증 링크를 누르면 그때부터 들어올 수 있어요.</p></div>
      <footer><button class="btn subtle" data-close>취소</button><button class="btn primary" id="okYes">승인</button></footer>`);
    $("#okYes").onclick = () => { closeModal(); approve(r, b); }; });
  main().querySelectorAll("[data-no]").forEach(b => b.onclick = () => { const r = reqs.find(x => x.uid === b.dataset.no); if (!r) return;
    modal(`<header><h2>거절할까요?</h2></header><div class="mb"><p>${esc(r.email)}의 가입 요청을 지워요.</p></div><footer><button class="btn subtle" data-close>취소</button><button class="btn danger" id="noYes">거절</button></footer>`);
    $("#noYes").onclick = async () => { closeModal(); try { await fs.collection("wiki_requests").doc(r.uid).delete(); toast("거절했어요"); } catch (ex) { toast(errMsg(ex)); } }; });
  main().querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    modal(`<header><h2>내보낼까요?</h2></header><div class="mb"><p>${esc(b.dataset.rm)}을(를) 팀에서 내보내요. 다시 들어오려면 가입 요청부터 해야 해요.</p></div><footer><button class="btn subtle" data-close>취소</button><button class="btn danger" id="rmYes">내보내기</button></footer>`);
    $("#rmYes").onclick = async () => { closeModal(); try { await fs.collection("wiki_members").doc(b.dataset.rm).delete(); toast("내보냈어요"); } catch (ex) { toast(errMsg(ex)); } }; });
}
function bootLocal(){ mode = "local"; showApp(); loadLocal(); }
wireChrome();
if (CFG.firebase && CFG.firebase.apiKey && !FORCE_LOCAL) bootCloud().catch(() => { toast("서버에 연결하지 못했어요. 이 브라우저 저장 모드로 열어요"); bootLocal(); });
else bootLocal();
</script>
</body>
</html>
